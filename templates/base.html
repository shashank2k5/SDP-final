{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}{{ page_title|default:"Dashboard" }} · {{ SITE_NAME }}{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'vendor/inter/inter.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}"
      data-currency="{{ CURRENCY_CODE }}"
      data-locale="{{ CURRENCY_LOCALE }}"
      data-site-name="{{ SITE_NAME }}"
      {% block body_attrs %}{% endblock %}>
    {% block body %}{% endblock %}

    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
